<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo Italiano</title>
<style>
  :root{
    --aperol:#F25C05; --limon:#FFE45C; --basil:#1E7F3A; --pomodoro:#C9221E;
    --cream:#FFF8E1; --ink:#2B1B12;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:Georgia,"Times New Roman",serif;
    color:var(--ink);
    background:var(--aperol);
    background-image:
      linear-gradient(180deg, rgba(255,228,92,.55), rgba(255,228,92,0) 45%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 28px, transparent 28px 56px);
    padding:0 16px 48px;
  }
  .flag{height:10px;display:flex;margin:0 -16px 22px}
  .flag i{flex:1}
  .flag i:nth-child(1){background:var(--basil)}
  .flag i:nth-child(2){background:#fff}
  .flag i:nth-child(3){background:var(--pomodoro)}
  main{max-width:440px;margin:0 auto}
  header{text-align:center;margin-bottom:22px}
  .lemons{font-size:40px;letter-spacing:6px;line-height:1}
  h1{
    font-family:"Brush Script MT","Snell Roundhand","Apple Chancery",cursive;
    font-weight:400;font-size:clamp(64px,20vw,92px);line-height:.95;
    color:var(--cream);margin:2px 0 0;
    text-shadow:3px 3px 0 var(--pomodoro),6px 6px 0 rgba(0,0,0,.15);
  }
  .sub{color:var(--ink);margin:10px 0 0;font-size:17px;font-style:italic}

  .card{
    background:var(--cream);border-radius:6px;padding:22px 20px;
    border:3px solid var(--ink);
    box-shadow:0 8px 0 var(--pomodoro),0 8px 24px rgba(0,0,0,.25);
    background-image:repeating-linear-gradient(45deg,transparent 0 22px,rgba(201,34,30,.06) 22px 24px);
  }
  label{display:block;font-size:17px;margin-bottom:8px;font-style:italic}
  input{
    width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:6px;
    border:3px solid var(--ink);background:#fff;color:var(--ink)
  }
  input:focus,button:focus-visible{outline:4px solid var(--limon);outline-offset:2px}
  button{
    font:inherit;font-weight:700;font-size:18px;cursor:pointer;border-radius:6px;
    padding:13px 18px;border:3px solid var(--ink);background:var(--limon);color:var(--ink);
    box-shadow:0 4px 0 var(--ink);transition:transform .08s
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  button.quiet{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;padding:8px 6px;font-weight:400;font-style:italic}
  .row{display:flex;gap:10px;margin-top:16px;align-items:center;justify-content:space-between}

  .who{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;border-bottom:2px dashed var(--pomodoro);padding-bottom:8px}
  .who b{font-size:24px}
  .who span{font-size:15px;font-style:italic}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile:nth-child(5){grid-column:1/-1;min-height:110px}
  .tile{
    position:relative;min-height:150px;padding:14px;border-radius:6px;
    background:#fff;border:3px solid var(--ink);text-align:left;
    font-weight:400;font-size:16px;line-height:1.3;display:flex;align-items:center;
    box-shadow:0 4px 0 var(--ink);color:var(--ink)
  }
  .tile.done{background:var(--limon)}
  .tile.done::after{
    content:"🍋";position:absolute;inset:0;display:grid;place-items:center;
    font-size:96px;opacity:.9;transform:rotate(-14deg);pointer-events:none
  }
  .tile.done span{opacity:.35}

  .bingo{
    margin-top:18px;text-align:center;
    font-family:"Brush Script MT","Snell Roundhand","Apple Chancery",cursive;
    font-size:64px;color:var(--pomodoro);line-height:1;
    animation:pop .5s cubic-bezier(.2,1.6,.4,1)
  }
  @keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
  @media (prefers-reduced-motion:reduce){.bingo{animation:none}}
  .hidden{display:none}
  footer{text-align:center;margin-top:28px;color:var(--ink);font-style:italic;font-size:15px}
</style>
</head>
<body>
<div class="flag"><i></i><i></i><i></i></div>
<main>
  <header>
    <div class="lemons">🍋🍊🍋</div>
    <h1>Bingo Italiano</h1>
    <p class="sub">Vijf opdrachten per persoon. Tik erop als het gebeurd is.</p>
  </header>

  <section class="card" id="start">
    <label for="name">Wie ben jij?</label>
    <input id="name" placeholder="Je naam" autocomplete="off">
    <div class="row">
      <button id="go">Dammi la mia carta 🍹</button>
    </div>
  </section>

  <section class="card hidden" id="play">
    <div class="who"><b id="player"></b><span id="score"></span></div>
    <div class="grid" id="grid"></div>
    <div class="bingo hidden" id="bingo">Mamma mia, BINGO!</div>
    <div class="row">
      <button class="quiet" id="switch">Andere speler</button>
    </div>
  </section>
  <footer>Un Aperol al giorno, toglie il medico di torno.</footer>
</main>

<script>
const EVENT = "bingo-2026"; // wijzig dit om iedereen een nieuwe kaart te geven
const TASKS = [
  "DH wint spirit",
  "Jani doet geen layout (1 game)",
  "4 love points in 1 game",
  "Jan valt in slaap op toilet",
  "Amelie is verkleed op feestje",
  "Iemand geraakt kwijt voor meer dan een uur",
  "Lindert deelt drank uit met een pollepel",
  "DH speelt finale",
  "Fery duikt op met slagroom bus voor toef toef",
  "Lindert draagt een pamper van Fien",
  "Fery drinkt een pintje voor 10u",
  "Iemand ruilt zijn shirt met een tegenstander",
  "Kirsten drinkt een limoncello voor 10u",
  "Iemand duikt in een stadsfontein",
  "Ann-Sophie koopt veel te veel olijven",
  "Een toren van 4 mensen in zee",
  "Iemand begraven in het zand",
  "Spirit cirkel in zee",
  "Ems draagt meer als 4 zonnebrillen",
  "Iemand wordt tegengehouden in supermarkt wegens diefstal van kartonnen reclame",
  "Max sluit het feestje mee af",
  "Martijn blijft op een feestje tot na middernacht",
  "Skinny dippen met meer als 10+",
  "Iemand van DH is met winkelkar op feestje",
  "Fery speelt match mee met een ander niet-DH team",
];

// --- storage (persists per name; falls back to memory) ---
const mem = {};
const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k,false); return r ? JSON.parse(r.value) : null; } }catch(e){}
    try{ const r = localStorage.getItem(k); if(r) return JSON.parse(r); }catch(e){}
    return mem[k] ?? null;
  },
  async set(k,v){
    mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k, JSON.stringify(v), false); return; } }catch(e){}
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
  },
};

// --- seeded shuffle so a name always gets the same card ---
function seedFrom(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ return ()=>{ seed=(seed+0x6D2B79F5)|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pick5(seed){ const r=rng(seed), idx=TASKS.map((_,i)=>i); for(let i=idx.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; } return idx.slice(0,5); }

const $=id=>document.getElementById(id);
let state=null; // {name, salt, tasks:[idx], done:[bool]}

function keyFor(name){ return "bingo:"+name.trim().toLowerCase(); }

async function load(name){
  name=name.trim(); if(!name) return;
  let s=await store.get(keyFor(name));
  if(!s){ s={name, tasks:pick5(seedFrom(EVENT+"|"+name.toLowerCase())), done:[false,false,false,false,false]}; await store.set(keyFor(name),s); }
  state=s; render();
}

function render(){
  $("start").classList.add("hidden"); $("play").classList.remove("hidden");
  $("player").textContent=state.name;
  const n=state.done.filter(Boolean).length;
  $("score").textContent=n+" van 5";
  const g=$("grid"); g.innerHTML="";
  state.tasks.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="tile"+(state.done[i]?" done":"");
    b.innerHTML="<span></span>"; b.querySelector("span").textContent=TASKS[t];
    b.setAttribute("aria-pressed", state.done[i]);
    b.onclick=async()=>{ state.done[i]=!state.done[i]; await store.set(keyFor(state.name),state); render(); };
    g.appendChild(b);
  });
  $("bingo").classList.toggle("hidden", n<5);
}

$("go").onclick=()=>load($("name").value);
$("name").addEventListener("keydown",e=>{ if(e.key==="Enter") load($("name").value); });
$("switch").onclick=()=>{ state=null; $("name").value=""; $("play").classList.add("hidden"); $("start").classList.remove("hidden"); $("name").focus(); };
</script>
</body>
</html>
